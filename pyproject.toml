[project]
name = "gecx-temporal-workflow-demo"
version = "0.2.0"
description = "CX Agent Studio (GECX) reference application demonstrating durable multi-turn workflow orchestration and cross-session state persistence with Temporal.io"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cxas-scrapi>=1.9.1",
    "fastapi>=0.115.0",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "temporalio>=1.9.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["temporal_service", "demo_ui"]

[tool.pytest.ini_options]
testpaths = ["evals", "tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"cxas_app/**/python_code.py" = ["F821"]
